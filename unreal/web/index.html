<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<title>Unreal (1992)</title>
<style>
  :root { --bg: #101014; --fg: #d8d8e0; --dim: #8a8a96; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  /* The picture is 320x200 but a VGA monitor showed it at 4:3, so its pixels
     were 20% taller than wide. Every box here is 4:3 and the canvas is
     STRETCHED into it (object-fit: fill, the default) - never "contain",
     which would keep the 16:10 of the bitmap. */
  canvas { display: block; width: min(96vw, calc(90vh * 4 / 3)); aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; }
  /* fullscreen is the STAGE, not the canvas: the browser forces a fullscreen
     element to fill the screen, so the canvas sits inside it as the largest
     4:3 box that fits, centred on black */
  #stage:fullscreen, #stage.max { display: flex; align-items: center; justify-content: center; background: #000; }
  #stage:fullscreen canvas { width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); aspect-ratio: auto; }
  /* the same without the Fullscreen API (iPhone Safari has none for anything
     but video): the stage covers the viewport. Launched from the Home Screen
     the viewport IS the whole screen, since the app has no browser chrome. */
  #stage.max { position: fixed; inset: 0; z-index: 10; }
  #stage.max canvas { width: min(100vw, calc(100dvh * 4 / 3)); height: min(100dvh, calc(100vw * 3 / 4)); aspect-ratio: auto; }
  body:has(#stage.max) { background: #000; overflow: hidden; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: center; width: 100%; }
  select, button { font: inherit; padding: 4px 8px; background: #1c1c24; color: var(--fg); border: 1px solid #444; border-radius: 4px; }
  button { cursor: pointer; }
  #status { color: var(--dim); font-variant-numeric: tabular-nums; min-height: 1.4em; font-family: ui-monospace, Consolas, monospace; font-size: 13px; white-space: pre-line; }
</style>
</head>
<body>
<main>
  <div id="stage"><canvas id="screen" width="320" height="200"></canvas></div>
  <div class="bar">
    <button id="start" disabled>Loading..</button>
    <label>Section
      <select id="section">
        <option value="">Whole demo</option>
        <option value="P1">1 - Opening</option>
        <option value="P2">2 - Scroller</option>
        <option value="P3">3 - World Vector</option>
        <option value="P4">4 - Vectorballs</option>
        <option value="P5">5 - Wormhole</option>
        <option value="P6">6 - Something</option>
        <option value="P7">7 - Texture</option>
        <option value="P8">8 - Landscape</option>
        <option value="P9">9 - Credits</option>
      </select>
    </label>
    <label title="Start goes fullscreen; F also toggles it"><input type="checkbox" id="full"> Fullscreen</label>
  </div>
  <div id="status"></div>
  <p style="color:var(--dim)">Future Crew's Unreal (v1.0, 1992)</p>
</main>
<script src="unreal_web.js"></script>
</body>
</html>
