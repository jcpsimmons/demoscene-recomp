<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Future Crew demos</title>
<style>
  :root { --bg: #101014; --fg: #d8d8e0; --dim: #8a8a96; --edge: #2a2a34; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 20px; text-align: center; }
  a.demo { display: block; padding: 16px 18px; margin: 12px 0; border: 1px solid var(--edge);
           border-radius: 8px; background: #16161c; color: var(--fg); text-decoration: none; }
  a.demo:hover, a.demo:focus { border-color: #555; background: #1c1c24; }
  .name { font-size: 18px; font-weight: 600; }
  .meta { color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Future Crew demos, in the browser</h1>
  <a class="demo" href="unreal/web/"><div class="name">Unreal</div><div class="meta">v1.0, 1992</div></a>
  <a class="demo" href="second/web/"><div class="name">Second Reality</div><div class="meta">1993</div></a>
</main>
</body>
</html>
